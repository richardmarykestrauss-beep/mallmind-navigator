# ─────────────────────────────────────────────────────────────────────────────
# QUARANTINED (Sprint 22C): do not schedule legacy direct-write scrapers.
#
# This workflow predates the 19C retail trust pipeline and writes mall/store
# data to Supabase with a service-role key, outside the staged/approved
# ingestion lanes (mall_sources / staged tables / Mall Intelligence review).
#
# All ingestion must go through staging + approval. Do not use
# SUPABASE_SERVICE_KEY here for direct writes. Do not re-add a `schedule:`
# trigger. Manual dispatch requires the acknowledgement input below.
# See docs/retail/retail-data-readiness-audit.md.
#
# HUMAN ACTION STILL REQUIRED: if the SUPABASE_SERVICE_KEY repository secret
# is configured, inspect/remove it in GitHub → Settings → Secrets.
# ─────────────────────────────────────────────────────────────────────────────
name: "[QUARANTINED] Legacy Mall & Store Scraper (manual only — do not schedule)"

on:
  # schedule trigger removed in Sprint 22C — see quarantine note above.
  workflow_dispatch:
    inputs:
      acknowledge:
        description: "Type QUARANTINED to confirm you know this legacy scraper bypasses the staged ingestion pipeline"
        required: true
        default: ""

jobs:
  scrape-malls:
    name: "[QUARANTINED] Scrape mall & store data (legacy — bypasses staging)"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Quarantine gate
        run: |
          echo "::warning::QUARANTINED legacy scraper. It bypasses staged/approved ingestion."
          if [ "${{ github.event.inputs.acknowledge }}" != "QUARANTINED" ]; then
            echo "::error::Refusing to run. Type QUARANTINED in the acknowledge input to proceed."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/scraper/package-lock.json

      - name: Install dependencies
        working-directory: scripts/scraper
        run: npm ci

      - name: Write .env
        working-directory: scripts/scraper
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> .env
          echo "GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}" >> .env

      - name: Run mall scraper
        working-directory: scripts/scraper
        run: npx tsx malls/index.ts
        env:
          NODE_OPTIONS: "--max-old-space-size=512"
