# ─────────────────────────────────────────────────────────────────────────────
# QUARANTINED (Sprint 22C): do not schedule legacy direct-write scrapers.
#
# This workflow predates the 19C retail trust pipeline. It runs scrapers that
# write directly to Supabase products using a service-role key, bypassing:
#   retail_data_sources → retail_source_snapshots → retail_import_batches →
#   retail_price_observations → admin review → approved-only publisher.
#
# All price ingestion must go through retail_price_observations staging +
# approval + publisher. Do not use SUPABASE_SERVICE_KEY here for product
# writes. Do not re-add a `schedule:` trigger.
#
# Manual dispatch is kept ONLY for future debugging of scraper *extraction*
# (not writes) and requires typing the acknowledgement below. A future
# scraper rebuild must output observations/snapshots/import batches, never
# direct product rows. See docs/retail/retail-data-readiness-audit.md.
#
# HUMAN ACTION STILL REQUIRED: if the SUPABASE_SERVICE_KEY repository secret
# is configured, inspect/remove it in GitHub → Settings → Secrets.
# ─────────────────────────────────────────────────────────────────────────────
name: "[QUARANTINED] Legacy Price Scraper (manual only — do not schedule)"

on:
  # schedule trigger removed in Sprint 22C — see quarantine note above.
  workflow_dispatch:
    inputs:
      acknowledge:
        description: "Type QUARANTINED to confirm you know this legacy scraper bypasses the retail trust pipeline"
        required: true
        default: ""
      retailer:
        description: "Run single retailer (leave empty for all)"
        required: false
        default: ""

jobs:
  scrape:
    name: "[QUARANTINED] Scrape retail prices (legacy — bypasses trust pipeline)"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Quarantine gate
        run: |
          echo "::warning::QUARANTINED legacy scraper. It bypasses the 19C retail trust pipeline."
          if [ "${{ github.event.inputs.acknowledge }}" != "QUARANTINED" ]; then
            echo "::error::Refusing to run. Type QUARANTINED in the acknowledge input to proceed."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/scraper/package-lock.json

      - name: Install dependencies
        working-directory: scripts/scraper
        run: npm ci

      - name: Write .env
        working-directory: scripts/scraper
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> .env

      - name: Install Playwright browser
        working-directory: scripts/scraper
        run: npx playwright install chromium --with-deps

      - name: Run scraper (all retailers)
        if: ${{ github.event.inputs.retailer == '' }}
        working-directory: scripts/scraper
        run: npx tsx index.ts
        env:
          NODE_OPTIONS: "--max-old-space-size=512"

      - name: Run scraper (single retailer)
        if: ${{ github.event.inputs.retailer != '' }}
        working-directory: scripts/scraper
        run: npx tsx scrapers/${{ github.event.inputs.retailer }}.ts
        env:
          NODE_OPTIONS: "--max-old-space-size=512"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_id }}
          path: scripts/scraper/*.log
          retention-days: 7
          if-no-files-found: ignore
