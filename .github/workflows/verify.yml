name: MallMind Build OS Verification

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - build-os-foundation-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mallmind-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            google-cloud-backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: google-cloud-backend
        run: npm ci

      - name: Run authoritative verification
        run: npm run verify:all
