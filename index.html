<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MallMind — Mall Wayfinding for SA Shoppers</title>
    <meta name="description" content="Find a shop, toilet, lift or food court inside a South African mall and preview the walking route with MallMind." />
    <meta name="author" content="MallMind" />

    <meta property="og:title" content="MallMind — Find any shop inside the mall." />
    <meta property="og:description" content="Store finder and route preview for South African malls." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/icons/icon-512.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MallMind" />
    <meta name="theme-color" content="#00d4ff" />
  </head>

  <body>
    <div id="root"></div>
    <!-- Last-resort recovery, outside React: if the app's own script never arrives (offline before
         the first visit finished saving, or a stale deploy), say so instead of a blank screen. -->
    <script>
      (function () {
        var failed = false;
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) failed = true;
        }, true);
        setTimeout(function () {
          var root = document.getElementById("root");
          if (!failed || !root || root.childNodes.length) return;
          root.innerHTML = '<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:system-ui,sans-serif;color:#e6e6e6;background:#0b0b10">' +
            '<p style="font-size:18px;font-weight:600;margin:0">MallMind couldn\u2019t load this venue yet.</p>' +
            '<p style="font-size:14px;opacity:.8;max-width:22rem;margin:8px 0 0">' + (navigator.onLine === false ? 'You\u2019re offline and MallMind isn\u2019t fully saved on this phone yet. Connect once, then it works offline.' : 'Part of MallMind didn\u2019t download. Check your connection and try again.') + '</p>' +
            '<button type="button" onclick="location.reload()" style="margin-top:20px;min-height:44px;padding:0 18px;border-radius:10px;border:0;background:#00d4ff;color:#06131a;font-weight:600;font-size:14px">Retry</button></div>';
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
